# scripted/written by Robert Bopko (github.com/zeroznet) with Boba Bott (Claude Opus 4.7)

name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions: read-all

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          set -eu
          out=$(gofmt -l .)
          if [ -n "${out}" ]; then
            echo "::error::unformatted files:"
            printf '%s\n' "${out}"
            exit 1
          fi

      - name: go vet
        run: |
          set -eu
          go vet ./...
          go vet -tags=integration ./...

      - name: go mod verify
        run: go mod verify

      # govulncheck runs non-blocking by design. The appliance builds with
      # alpine's apk go, and alpine packages Go patch releases weeks after
      # upstream security fixes, so a blocking gate would fail whenever a
      # fresh stdlib CVE lands upstream — structural lag, not a fixable
      # state. Review the output when bumping the toolchain; the strict-gate
      # option (go.dev toolchain pivot) is tracked in TODO.md.
      - name: govulncheck
        continue-on-error: true
        run: |
          set -eu
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...

      - name: Unit tests
        run: go test -count=1 ./...

      - name: Ensure /dev/net/tun is accessible
        run: |
          set -eu
          sudo modprobe tun || true
          sudo chmod 0666 /dev/net/tun
          ls -la /dev/net/tun

      - name: Integration tests
        run: |
          set -eu
          sudo -E env "PATH=$PATH" go test -count=1 -tags=integration ./...

      - name: Build verify
        run: |
          set -eu
          CGO_ENABLED=0 go build \
            -trimpath \
            -ldflags "-s -w -buildid=" \
            -o /dev/null \
            ./cmd/wsl-vpnfix

      # Mirrors build/pack.sh's awk parsing of build/upstream-pins.yaml.
      # Runs on every CI pass so a tag-only Renovate bump (sha256 lines are
      # maintained manually) turns the PR red here instead of breaking the
      # release-tag build later, and continuously proves the pinned
      # artifacts are still downloadable.
      - name: Verify upstream pins (fetcher stage)
        run: |
          set -eu
          PINS=build/upstream-pins.yaml
          GVTV_TAG=$(awk '/^  tag:/ { print $2; exit }' "$PINS")
          GVF_SHA=$(awk '/^    gvforwarder:/ { f=1; next } f && /sha256:/ { print $2; exit }' "$PINS")
          GVP_SHA=$(awk '/^    gvproxy-windowsgui\.exe:/ { f=1; next } f && /sha256:/ { print $2; exit }' "$PINS")
          test -n "$GVTV_TAG" && test -n "$GVF_SHA" && test -n "$GVP_SHA"
          podman build \
            --target fetcher \
            --file build/Dockerfile.rootfs \
            --build-arg "GVTV_TAG=$GVTV_TAG" \
            --build-arg "GVTV_GVFORWARDER_SHA256=$GVF_SHA" \
            --build-arg "GVTV_GVPROXY_EXE_SHA256=$GVP_SHA" \
            .

      - name: Race detector (CGO required)
        run: |
          set -eu
          CGO_ENABLED=1 go test -race -count=1 ./...
